name: Check AtCoder Contests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-contests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install icalendar

      - name: Check contests
        run: python scripts/check_contests.py