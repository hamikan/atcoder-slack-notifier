name: Check AtCoder Contests

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: "0 0 * * *"

    # 12:00 JST = 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      force_next_contest:
        description: "次のコンテストを強制的に選ぶ"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  check-contests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Slack notification
        if: github.event_name == 'schedule'
        env:
          SLACK_WORKFLOW_WEBHOOK_URL: ${{ secrets.SLACK_WORKFLOW_WEBHOOK_URL }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_PROD_CHANNEL_ID }}
        run: python scripts/check_contests.py

      - name: Send test Slack notification
        if: github.event_name == 'workflow_dispatch'
        env:
          SLACK_WORKFLOW_WEBHOOK_URL: ${{ secrets.SLACK_WORKFLOW_WEBHOOK_URL }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_TEST_CHANNEL_ID }}
          FORCE_NEXT_CONTEST: ${{ inputs.force_next_contest }}
        run: python scripts/check_contests.py
