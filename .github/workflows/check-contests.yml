name: Check AtCoder Contests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-contests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install icalendar

      - name: Check contests
        run: python scripts/check_contests.py
    
      - name: Test Slack notification
        env:
          SLACK_WORKFLOW_WEBHOOK_URL: ${{ secrets.SLACK_WORKFLOW_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d '{
              "contest_type": "ABC",
              "contest_name": "AtCoder Beginner Contest 474",
              "start_time": "9月6日（日）13:10",
              "contest_url": "https://atcoder.jp/contests/abc474"
            }' \
            "$SLACK_WORKFLOW_WEBHOOK_URL"
